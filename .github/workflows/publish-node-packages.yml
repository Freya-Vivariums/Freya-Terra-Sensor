name: Publish Node.js client packages

# PAUSED: this workflow no longer publishes automatically on release.
# These packages are published to npm by hand for now. Publishing still
# builds and verifies the package either way, because that happens in
# each package's prepublishOnly, not here.
#
# To resume automatic publishing, restore the release trigger:
#   on:
#     release:
#       types:
#         - created
on:
  workflow_dispatch:

jobs:
  publish-library:
    name: Publish SDK library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/Client/Node/Library
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      - name: Build package
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Runs after the SDK library, which this package depends on by version range:
  # verify.sh refuses to publish against a library version that is not on the
  # registry yet.
  publish-node-red:
    name: Publish Node-RED node
    needs: publish-library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/Client/Node/Node-RED
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm install

      # prepublishOnly builds the package and verifies that what npm is about
      # to upload is loadable by Node-RED, so no separate build step is needed.
      # Access is set by publishConfig in package.json.
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
